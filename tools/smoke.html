<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>铁引力 · 冒烟测试（工具页）</title>
<style>body{font:13px/1.6 Consolas,monospace;background:#0a0b10;color:#e9ecf4;margin:0;padding:14px}
#out{white-space:pre-wrap}
iframe{width:1100px;height:600px;border:1px solid #333;margin:8px 0;opacity:.25}</style>
</head>
<body>
<div id="out">RUNNING（等待 iframe 加载…）</div>
<iframe id="f" src="../log.html"></iframe>
<script>
/* 说明：这是自带的端到端冒烟测试。用 --allow-file-access-from-files 打开本页时，
   它会在 iframe 里加载真实页面、模拟真实点击，并把 PASS/FAIL 结果写进本页 DOM，
   便于用 `chrome --headless --dump-dom` 一次性读取结果。
   为了可以重复运行，先清掉本站自己的存储键（不会动其他数据）。 */
["ig_log_sessions", "ig_fav_exercises", "ig_fav_creators", "ig_nutrition_target", "ig_body", "ig_theme", "ig_custom_plans"].forEach(function (k) {
  try { localStorage.removeItem(k); } catch (e) {}
});

var log = [];
function step(name, ok, extra) { log.push((ok ? "PASS" : "FAIL") + " | " + name + (extra ? " | " + extra : "")); }
function report() {
  var fail = log.filter(function (x) { return x.indexOf("FAIL") === 0; }).length;
  document.getElementById("out").textContent = log.join("\n") + "\n\n===== 合计 " + log.length + " 项，失败 " + fail + " 项 =====";
}
function tryStep(name, fn) { try { fn(); } catch (e) { step(name, false, "异常: " + e.message); } }

function loadPage(url, cb) {
  var old = document.getElementById("f");
  var nf = document.createElement("iframe");
  nf.id = "f"; nf.src = url;
  nf.onload = function () { setTimeout(function () { cb(nf.contentWindow, nf.contentDocument); }, 900); };
  old.parentNode.replaceChild(nf, old);
}

window.addEventListener("load", function () {
  setTimeout(function () { testLog(); }, 1500);
});

function testLog() {
  loadPage("../log.html", function (w, d) {
    var $ = function (s) { return d.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(d.querySelectorAll(s)); };
    var lsOk = (function () { try { w.localStorage.setItem("__smoke", "1"); var v = w.localStorage.getItem("__smoke") === "1"; w.localStorage.removeItem("__smoke"); return v; } catch (e) { return false; } })();
    step("本地存储可用", lsOk, "直接读写探针");
    step("日志页已初始化（动作块 > 0）", $$(".lgitem").length > 0, $$(".lgitem").length + " 个动作块");
    step("每组默认 3 行输入", $$(".setrow").length === $$(".lgitem").length * 3, $$(".setrow").length + " 行");
    /* v1.1 新增：无历史 → 首次训练建议 */
    step("无历史显示「首次」建议", !!$(".lgitem .sugbar") && $(".lgitem .sugbar").textContent.indexOf("首次") > -1, $(".lgitem .sugbar") ? $(".lgitem .sugbar").textContent.replace(/\s+/g, " ").slice(0, 50) : "无");
    step("计划下拉 6 项", $("#lgPlan") && $("#lgPlan").options.length === 6, $("#lgPlan") ? $("#lgPlan").options.length + " 项" : "无");
    step("历史初始为空态", $("#lgHistory") && $("#lgHistory").textContent.indexOf("还没有记录") > -1);
    tryStep("填写并保存一次训练", function () {
      var box = $(".lgitem");
      var wi = box.querySelector(".w"), ri = box.querySelector(".r");
      wi.value = "60"; ri.value = "10";
      wi.dispatchEvent(new w.Event("input", { bubbles: true }));
      step("实时合计更新", $("#lgSummary").textContent.indexOf("600") > -1, $("#lgSummary").textContent.slice(0, 50));
      $("#lgSave").click();
      step("历史出现 1 条记录", $$(".hist").length === 1, $$(".hist").length + " 条");
      step("记录里保存了重量×次数", $("#lgHistory").textContent.indexOf("60×10") > -1);
      var raw = w.localStorage.getItem("ig_log_sessions") || "";
      step("数据确实写进 localStorage", raw.indexOf("60") > -1, raw.length + " 字符");
      var box2 = $(".lgitem");
      box2.querySelector(".w").value = "65";
      box2.querySelector(".r").value = "8";
      $("#lgSave").click();
      step("第二次保存成功（为折线图提供第 2 个点）", $$(".hist").length === 2, $$(".hist").length + " 条");
      var raw2 = w.localStorage.getItem("ig_log_sessions") || "";
      step("两条记录都在库里", raw2.indexOf("65") > -1, raw2.length + " 字符");
    });
    /* v16 新增：上次记录提示 + 一键沿用 */
    tryStep("上次记录提示与沿用", function () {
      var lb = $(".lgitem .lastbar");
      step("出现「上次」提示条", !!lb, lb ? lb.textContent.replace(/\s+/g, " ").slice(0, 42) : "无");
      var btn = $(".lgitem .uselast");
      step("有「沿用上次」按钮", !!btn);
      if (btn) {
        var before = $(".lgitem .setrow .w").value;
        btn.click();
        var after = $(".lgitem .setrow .w").value;
        step("沿用后填入上次重量（65）", after === "65", "点击前「" + before + "」→ 点击后「" + after + "」");
      }
    });
    tryStep("1RM 计算器", function () {
      $("#rmLift").value = "100"; $("#rmReps").value = "5";
      $("#rmLift").dispatchEvent(new w.Event("input", { bubbles: true }));
      step("1RM 输出正确（100×5 ≈ 116.7）", $("#rmOut").textContent.indexOf("116.7") > -1, $("#rmOut").textContent.slice(0, 40));
    });
    /* v16 新增：组间休息计时器 */
    tryStep("组间休息计时器", function () {
      var chips = $$("#restBox [data-rest]");
      step("预设 4 档", chips.length === 4, chips.length + " 档");
      if (chips.length) {
        chips[0].click();
        step("选 60 秒后显示 1:00", $("#restTime").textContent === "1:00", $("#restTime").textContent);
        $("#restStart").click();
        step("开始后按钮变「停止」", $("#restStart").textContent === "停止", $("#restStart").textContent);
        $("#restStart").click();
        step("停止后恢复「开始」", $("#restStart").textContent === "开始", $("#restStart").textContent);
      }
    });
    tryStep("容量核算器", function () {
      $("#volSets").value = "6";
      for (var i = 0; i < 3; i++) { $("#volEx").selectedIndex = i; $("#volAdd").click(); }
      step("容量汇总卡片出现", $$(".vol").length > 0, $$(".vol").length + " 张卡");
      step("给出区间提示", $("#volTotals").textContent.indexOf("组") > -1, $("#volTotals").textContent.replace(/\s+/g, " ").slice(0, 60));
    });
    tryStep("体测记录与体重趋势", function () {
      $("#bwDate").value = "2026-10-08"; $("#bwW").value = "65.0"; $("#bwAdd").click();
      $("#bwDate").value = "2026-10-15"; $("#bwW").value = "64.4"; $("#bwAdd").click();
      step("体测两条入库", $("#bwList").textContent.indexOf("体重 65") > -1 && $("#bwList").textContent.indexOf("64.4") > -1);
      step("体重趋势点数正确", $$("#trBw circle").length === 2, $$("#trBw circle").length + " 点");
    });
    tryStep("近 8 周肌群容量", function () {
      step("周容量按肌群出图", $$("#wkVol .wkrow").length > 0, $$("#wkVol .wkrow").length + " 个肌群");
      step("本周有非零组数", /<em>[1-9]/.test($("#wkVol").innerHTML), $("#wkVol").textContent.replace(/\s+/g, " ").slice(0, 80));
    });
    /* v14 新增：数据生命周期（导出 → 清空）—— 此前 88 项断言全绿却漏掉这两处缺陷 */
    tryStep("数据生命周期（导出 / 清空）", function () {
      var before = w.localStorage.getItem("ig_log_sessions");
      /* 1) 导出 payload 必须含自定义课表与体测 */
      var captured = null, OB = w.Blob, oldCreate = w.URL.createObjectURL, oldClick = w.HTMLAnchorElement.prototype.click;
      w.Blob = function (parts, o) { captured = parts && parts[0]; return new OB(parts, o); };
      w.URL.createObjectURL = function () { return "blob:x"; };
      w.HTMLAnchorElement.prototype.click = function () {};
      w.localStorage.setItem("ig_custom_plans", JSON.stringify([{ id: "my-smoke", name: "副本", schedule: [] }]));
      $("#lgExport").click();
      w.Blob = OB; w.URL.createObjectURL = oldCreate; w.HTMLAnchorElement.prototype.click = oldClick;
      var js = {};
      try { js = captured ? JSON.parse(captured) : {}; } catch (e) { js = {}; }
      step("导出备份含自定义课表与体测",
        !!(js.customs && js.customs.length) && !!(js.body && js.body.length),
        "键：" + Object.keys(js).join(","));
      w.localStorage.removeItem("ig_custom_plans");
      /* 2) 清空后容量图与月历必须同步清空（alert/confirm 都要先接管，否则无头浏览器会挂在对话框上） */
      var oc = w.confirm, oa = w.alert;
      w.confirm = function () { return true; };
      w.alert = function () {};
      $("#lgWipe").click();
      w.confirm = oc; w.alert = oa;
      var rows = $$("#wkVol .wkrow").length, lit = $$("#calGrid .d.has").length;
      step("清空后容量图与月历不残留", rows === 0 && lit === 0, "wkrow=" + rows + " lit=" + lit);
      /* 还原训练记录：后续 plans 页的打卡断言依赖这 2 条数据 */
      if (before) w.localStorage.setItem("ig_log_sessions", before);
    });
    testExercises();
  });
}

    function $(s) { return d.querySelector(s); }

    step("排序/收藏控件已注入", !!$("#exSort") && !!$("#exFavChip"));
    step("肌群筛选行已注入（8 档）", $$("#fMus .chip").length === 8, $$("#fMus .chip").length + " 档");
    tryStep("收藏一个动作", function () {
      var fav = $(".excard .fav");
      fav.click();
      var key = w.localStorage.getItem("ig_fav_exercises") || "";
      step("收藏写入 localStorage", key.length > 2, key);
      step("星标变成已选中", $(".excard .fav").classList.contains("on"));
    });
    tryStep("只看收藏过滤", function () {
      $("#exFavChip").click();
      step("过滤后只剩收藏项", $$(".excard").length === 1, $$(".excard").length + " 张");
      $("#exFavChip").click();

    });
    tryStep("排序可用", function () {
      $("#exSort").value = "level";
      $("#exSort").dispatchEvent(new w.Event("change", { bubbles: true }));
      var first = $(".excard .lv");
      step("按难度排序后首项为「入门」", first && first.textContent.indexOf("入门") > -1, first ? first.textContent : "无");
      $("#exSort").value = "default";
      $("#exSort").dispatchEvent(new w.Event("change", { bubbles: true }));

    step("动作线稿图示已注入", !!$(".excard .art svg") && $$(".excard .art svg").length >= 2, $$(".excard .art svg").length + " 张");
    /* v14 新增：键盘路径（此前 Enter/Space 完全无效，且 role=button 内嵌收藏按钮） */
    tryStep("动作卡键盘可达", function () {
      var hit = $(".excard .hit"), card = $(".excard");
      step("命中区是原生 button", !!hit && hit.tagName === "BUTTON", hit ? hit.tagName : "无");
      step("卡片不再是伪按钮（无 role/tabindex）", !card.getAttribute("role") && !card.getAttribute("tabindex"));
      hit.focus();
      hit.click();
      var ov = d.getElementById("overlay");
      step("激活后打开动作弹窗", !!ov && ov.classList.contains("open"));
      if (ov && ov.querySelector(".x")) ov.querySelector(".x").click();
    });
    step("练前热身序列 8 条", $$("#warmGrid .wrow").length === 8, $$("#warmGrid .wrow").length + " 条");
    testEvidence();
  });
}

/* v15 新增：证据页与「注意人群」——内容证据链的最小回归 */

function testTrend() {

    var $ = function (s) { return d.querySelector(s); };

function testDetail() {

    var $ = function (s) { return d.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(d.querySelectorAll(s)); };
    step("详情页渲染动作名（页头标题）", $("#dTitle") && $("#dTitle").textContent.indexOf("杠铃卧推") > -1, $("#dTitle") ? $("#dTitle").textContent : "无");

        loadPage("../detail.html?id=db-shoulder-press&panel=part", function (w4, d4) {

              loadPage("../exercises.html?muscle=胸", function (w7, d7) {
                var n7 = d7.querySelectorAll(".excard").length;
                step("?muscle=胸 过滤生效（0 < n < 60）", n7 > 0 && n7 < 60, n7 + " 张");
                loadPage("../exercises.html?muscle=小腿", function (w8, d8) {
                  var n8 = d8.querySelectorAll(".excard").length;
                  step("?muscle=小腿 过滤生效", n8 > 0 && n8 < 60, n8 + " 张");
                  /* ---- 外部评审回归（P0/P1）---- */
                  loadPage("../log.html", function (wL, dL) {
                    var accFill = wL.getComputedStyle(dL.documentElement).getPropertyValue("--acc-fill").trim();
                    step("P0 修复：--acc-fill 深色主题可解析", accFill.length > 0, accFill || "(空)");
                    var stamp = dL.createElement("span"); stamp.className = "stamp on"; dL.body.appendChild(stamp);
                    var bg = wL.getComputedStyle(stamp).backgroundColor;

                    var cal = dL.createElement("div"); cal.className = "cal";
                    var dd = dL.createElement("div"); dd.className = "d has"; cal.appendChild(dd);
                    var dt = dL.createElement("div"); dt.className = "d today"; cal.appendChild(dt);
                    dL.body.appendChild(cal);
                    var bc = wL.getComputedStyle(dd).borderColor, sh = wL.getComputedStyle(dt).boxShadow;

                    var bw = parseFloat(wL.getComputedStyle(dd).borderTopWidth) || 0;
                    var bgc = wL.getComputedStyle(dd).backgroundColor;
                    step("P0 修复：日历'练过'描边 + '今天'双圈生效", bw > 0 && bc !== bgc && sh !== "none", bc + " / " + (sh === "none" ? "none" : "有"));
                    stamp.remove(); cal.remove();
                    loadPage("../glossary.html", function (wG, dG) {
                      var ld = dG.querySelector('script[type="application/ld+json"]');

                      try { var j = JSON.parse(ld.textContent); n = (j.mainEntity || []).length; okLd = j["@type"] === "FAQPage" && n >= 10; } catch (e) {}
                      step("P2 修复：术语页 JSON-LD（FAQPage ≥10 问）", okLd, n + " 问");
                      loadPage("../index.html", function (wH, dH) {
                        var ldh = dH.querySelector('script[type="application/ld+json"]');
                        var okH = false;
                        try { okH = JSON.parse(ldh.textContent)["@type"] === "WebSite"; } catch (e) {}
                        step("P2 修复：首页 JSON-LD（WebSite）", okH, "");
                        var units = [], dup = false;
                        ["stVideos", "stTerms", "stFaq"].forEach(function (id) {
                          var v = dH.getElementById(id).textContent, k = dH.getElementById(id).nextElementSibling.textContent;
                          if (/^\s*条/.test(k) || /^\s*问/.test(k)) dup = true;
                          units.push(v + " | " + k);
                        });
                        step("P1 修复：首页统计单位不重复", !dup, units.join(" ; "));
                        /* ---- v12：无障碍与代码质量回归 ---- */
                        step("v12：首页跳过链接 + #main 锚点", !!dH.querySelector("a.skip") && !!dH.querySelector("#main"), "");
                        var cur = dH.querySelector('.nav a[aria-current="page"]');

                        step("v12：图标 svg 已 aria-hidden（≥6）", dH.querySelectorAll('svg[aria-hidden="true"]').length >= 6, dH.querySelectorAll('svg[aria-hidden="true"]').length + " 个");
                        step("v12：卡片元信息行 .metarow 生效", dH.querySelectorAll(".metarow").length >= 1, dH.querySelectorAll(".metarow").length + " 处");
                        var tb = dH.getElementById("themeBtn");
                        step("v12：主题按钮 aria-pressed 有值", !!tb && (tb.getAttribute("aria-pressed") === "true" || tb.getAttribute("aria-pressed") === "false"), tb ? tb.getAttribute("aria-pressed") : "(无按钮)");
                        loadPage("../muscles.html", function (wM, dM) {
                          step("v12：肌群页跳过链接 + #main 锚点", !!dM.querySelector("a.skip") && !!dM.querySelector("#main"), "");
                          step("v12：nav 有 aria-label", !!dM.querySelector('nav[aria-label]'), "");
                          loadPage("../detail.html?id=squat", function (wD, dD) {
                            var sub = dD.getElementById("dSub");
                            step("v12：详情页副标题 aria-live", !!sub && sub.getAttribute("aria-live") === "polite", "");
                            var tb2 = dD.getElementById("themeBtn");
                            step("v12：详情页主题按钮 aria-pressed", !!tb2 && tb2.getAttribute("aria-pressed") !== null, "");
                            report();
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}
